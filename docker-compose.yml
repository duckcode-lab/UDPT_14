version: '3.8'

networks:
  cinema-network:
    driver: bridge

volumes:
  auth_db_data:
  show_db_data:
  booking_db_data:
  payment_db_data:
  notification_db_data:
  redis_data:
  kafka_data:

services:
  # =========================================================================
  # 1. HẠ TẦNG DỮ LIỆU RIÊNG BIỆT (DATABASE-PER-SERVICE PATTERN)
  # =========================================================================
  auth-db:
    image: mariadb:10.11
    container_name: auth-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_secret
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--performance-schema=0',
      '--innodb-buffer-pool-size=16M'
    ]
    ports:
      - "3307:3306"
    volumes:
      - auth_db_data:/var/lib/mysql
    networks:
      - cinema-network

  show-db:
    image: mariadb:10.11
    container_name: show-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: show_db
      MYSQL_USER: show_user
      MYSQL_PASSWORD: show_secret
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--performance-schema=0',
      '--innodb-buffer-pool-size=16M'
    ]
    ports:
      - "3308:3306"
    volumes:
      - show_db_data:/var/lib/mysql
    networks:
      - cinema-network

  booking-db:
    image: mariadb:10.11
    container_name: booking-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: booking_db
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_secret
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--performance-schema=0',
      '--innodb-buffer-pool-size=16M'
    ]
    ports:
      - "3309:3306"
    volumes:
      - booking_db_data:/var/lib/mysql
    networks:
      - cinema-network

  payment-db:
    image: mariadb:10.11
    container_name: payment-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payment_user
      MYSQL_PASSWORD: payment_secret
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--performance-schema=0',
      '--innodb-buffer-pool-size=16M'
    ]
    ports:
      - "3310:3306"
    volumes:
      - payment_db_data:/var/lib/mysql
    networks:
      - cinema-network

  notification-db:
    image: mariadb:10.11
    container_name: notification-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: notification_db
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: notification_secret
    command: [
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--performance-schema=0',
      '--innodb-buffer-pool-size=16M'
    ]
    ports:
      - "3311:3306"
    volumes:
      - notification_db_data:/var/lib/mysql
    networks:
      - cinema-network

  # =========================================================================
  # 2. CACHE & DISTRIBUTED LOCK (REDIS)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: cinema-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cinema-network

  # =========================================================================
  # 3. MESSAGE BROKER - APACHE KAFKA (KRAFT MODE)
  # =========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: cinema-kafka
    restart: always
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cinema-network

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: cinema-kafka-init
    depends_on:
      - kafka
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      while [ $$? -ne 0 ]; do
        sleep 2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      done

      echo 'Kafka is ready! Creating topics...'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic booking-events --partitions 3 --replication-factor 1
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic payment-events --partitions 3 --replication-factor 1

      echo 'Topics created successfully:'
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "
    networks:
      - cinema-network

  # =========================================================================
  # 4. NĂM MICROSERVICES LÕI
  # =========================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: always
    environment:
      PORT: 8001
      DB_HOST: auth-db
      DB_PORT: 3306
      DB_USER: auth_user
      DB_PASSWORD: auth_secret
      DB_NAME: auth_db
      JWT_SECRET: super_secret_jwt_key_cinema_distributed
    ports:
      - "8001:8001"
    depends_on:
      - auth-db
    networks:
      - cinema-network

  show-service:
    build:
      context: ./services/show-service
      dockerfile: Dockerfile
    container_name: show-service
    restart: always
    environment:
      PORT: 8002
      GRPC_PORT: 50051
      DB_HOST: show-db
      DB_PORT: 3306
      DB_USER: show_user
      DB_PASSWORD: show_secret
      DB_NAME: show_db
    ports:
      - "8002:8002"
      - "50051:50051"
    volumes:
      - ./proto:/app/proto:ro
    depends_on:
      - show-db
    networks:
      - cinema-network

  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: booking-service
    restart: always
    environment:
      PORT: 8003
      DB_HOST: booking-db
      DB_PORT: 3306
      DB_USER: booking_user
      DB_PASSWORD: booking_secret
      DB_NAME: booking_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:9092
      SHOW_GRPC_HOST: show-service:50051
      PAYMENT_GRPC_HOST: payment-service:50052
    ports:
      - "8003:8003"
    volumes:
      - ./proto:/app/proto:ro
    depends_on:
      - booking-db
      - redis
      - kafka
      - show-service
      - payment-service
    networks:
      - cinema-network

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: always
    environment:
      PORT: 8004
      GRPC_PORT: 50052
      DB_HOST: payment-db
      DB_PORT: 3306
      DB_USER: payment_user
      DB_PASSWORD: payment_secret
      DB_NAME: payment_db
      KAFKA_BROKER: kafka:9092
    ports:
      - "8004:8004"
      - "50052:50052"
    volumes:
      - ./proto:/app/proto:ro
    depends_on:
      - payment-db
      - kafka
    networks:
      - cinema-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    environment:
      PORT: 8005
      DB_HOST: notification-db
      DB_PORT: 3306
      DB_USER: notification_user
      DB_PASSWORD: notification_secret
      DB_NAME: notification_db
      KAFKA_BROKER: kafka:9092
    ports:
      - "8005:8005"
    depends_on:
      - notification-db
      - kafka
    networks:
      - cinema-network

  # =========================================================================
  # 5. NGINX API GATEWAY
  # =========================================================================
  api-gateway:
    image: nginx:alpine
    container_name: cinema-api-gateway
    restart: always
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - show-service
      - booking-service
      - payment-service
      - notification-service
    networks:
      - cinema-network
