worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng log chi tiết chuẩn Microservices
    log_format json_analytics escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ==========================================
    # CẤU HÌNH RATE LIMITING (Chống spam / DDOS)
    # ==========================================
    # 1. Giới hạn chung: 50 requests/s mỗi IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

    # 2. Giới hạn xác thực (Auth): 5 requests/s để chống dò pass / bruteforce
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # 3. Giới hạn Đặt vé (Booking Flash-sale): 10 requests/s mỗi IP chống bot gom vé
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=10r/s;

    # Trả về mã lỗi 429 Too Many Requests khi vượt ngưỡng
    limit_req_status 429;

    # ==========================================
    # UPSTREAM LOAD BALANCING (5 Microservices)
    # ==========================================
    upstream auth_service_cluster {
        least_conn; # Thuật toán phân tải theo kết nối ít nhất
        server auth-service:8001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream show_service_cluster {
        least_conn;
        server show-service:8002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream booking_service_cluster {
        least_conn;
        server booking-service:8003 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream payment_service_cluster {
        least_conn;
        server payment-service:8004 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream notification_service_cluster {
        least_conn;
        server notification-service:8005 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================
    # SERVER API GATEWAY
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Cấu hình CORS chung cho toàn bộ API
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Service-Key' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Xử lý Preflight Request (OPTIONS)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ------------------------------------------
        # 1. Health check Gateway
        # ------------------------------------------
        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","gateway":"Nginx API Gateway","architecture":"Distributed Microservices","timestamp":"$time_iso8601"}';
        }

        # ------------------------------------------
        # 2. Định tuyến Auth Service (/api/auth)
        # ------------------------------------------
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://auth_service_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ------------------------------------------
        # 3. Định tuyến Show Service (/api/shows, /api/movies)
        # ------------------------------------------
        location /api/shows/ {
            limit_req zone=general_limit burst=20 nodelay;

            proxy_pass http://show_service_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /api/movies/ {
            limit_req zone=general_limit burst=20 nodelay;

            proxy_pass http://show_service_cluster/movies/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ------------------------------------------
        # 4. Định tuyến Booking Service (/api/bookings) - Có Rate Limit chặt chẽ
        # ------------------------------------------
        location /api/bookings/ {
            limit_req zone=booking_limit burst=10 nodelay;

            proxy_pass http://booking_service_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ------------------------------------------
        # 5. Định tuyến Payment Service (/api/payments)
        # ------------------------------------------
        location /api/payments/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://payment_service_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ------------------------------------------
        # 6. Định tuyến Notification Service (/api/notifications)
        # ------------------------------------------
        location /api/notifications/ {
            limit_req zone=general_limit burst=10 nodelay;

            proxy_pass http://notification_service_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ------------------------------------------
        # Trang gốc Gateway Info
        # ------------------------------------------
        location / {
            default_type application/json;
            return 200 '{"message":"Cinema Distributed Booking System API Gateway","routes":{"auth":"/api/auth/","shows":"/api/shows/","bookings":"/api/bookings/","payments":"/api/payments/","notifications":"/api/notifications/","health":"/health"}}';
        }
    }
}
